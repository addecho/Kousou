services:
  db:
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    environment:
      POSTGRES_USER: kousou
      POSTGRES_DB: kousou
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run pnpm setup first}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kousou -d kousou"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
volumes:
  pgdata:
