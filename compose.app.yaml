services:
  db:
    ports: !reset []
  migrate:
    image: kousou:local
    build: .
    command: ["node", "--import", "tsx", "apps/server/src/migrate.ts"]
    environment:
      DATABASE_URL: postgres://kousou:${POSTGRES_PASSWORD}@db:5432/kousou
    depends_on:
      db:
        condition: service_healthy
  app:
    image: kousou:local
    build: .
    environment:
      DATABASE_URL: postgres://kousou:${POSTGRES_PASSWORD}@db:5432/kousou
      SESSION_PEPPER: ${SESSION_PEPPER:?Run pnpm run setup first}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/v1/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
